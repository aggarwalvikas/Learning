<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outlook Subject Viewer</title>
    <link rel="stylesheet" href="taskpane.css?v=2" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="pane" aria-labelledby="pane-title">
      <p class="eyebrow">Selected message</p>
      <h1 id="pane-title">Message details</h1>
      <section class="subject-card" aria-live="polite">
        <p class="field-label">From</p>
        <p id="sender" class="sender-value">Loading sender...</p>
        <p class="field-label">Subject</p>
        <p id="subject" class="subject-value">Loading subject...</p>
      </section>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="taskpane.js?v=2"></script>
  </body>
</html>
